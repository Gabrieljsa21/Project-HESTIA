[project]
name = "hestia"
version = "0.7.0"
description = "Assistente de Steam da GAIA (lançamentos da wishlist, atividade de amigos, conquistas) - processo próprio, sem interface gráfica, consumido pela GAIA via HTTP."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "ddgs",
    "youtube-transcript-api",
    "python-dotenv",
    "browser-cookie3>=0.19",
    "segno>=1.6",
    "pywin32>=306",
]

[project.optional-dependencies]
teste = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hestia*"]

[project.scripts]
hestia = "hestia.main:main"
